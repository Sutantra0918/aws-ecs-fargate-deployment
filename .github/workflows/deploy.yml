name: AWS Infrastructure CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: true
  TF_WORKING_DIR: terraform/environments/dev

jobs:

  terraform-deploy:
    name: Terraform Deploy
    runs-on: ubuntu-latest

    outputs:
      alb_dns: ${{ steps.terraform_outputs.outputs.alb_dns }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ vars.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: terraform-deploy

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -var-file="dev.tfvars" \
            -input=false \
            -out=tfplan

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Get Terraform Outputs
        id: terraform_outputs
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "alb_dns=$(terraform output -raw alb_dns_name)" >> "$GITHUB_OUTPUT"

  prowler-scan:
    name: Prowler AWS Security Scan
    runs-on: ubuntu-latest

    needs:
      - terraform-deploy

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Configure AWS Credentials for Prowler
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PROWLER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: prowler-security-scan

      - name: Verify Prowler AWS Identity
        run: aws sts get-caller-identity

      - name: Run Prowler AWS Security Scan
        uses: prowler-cloud/prowler@5.44.0
        with:
          provider: aws
          output-formats: csv json-ocsf
          extra-env: AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_DEFAULT_REGION AWS_REGION
          flags: >-
            --region ${{ vars.AWS_REGION }}
            --ignore-exit-code-3

      - name: Upload Prowler Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prowler-aws-security-report
          path: output/
          if-no-files-found: warn
          retention-days: 14

  smoke-test:
    name: ALB Smoke Test
    runs-on: ubuntu-latest

    needs:
      - terraform-deploy
      - prowler-scan

    steps:
      - name: Test ALB and ECS
        env:
          ALB_DNS: ${{ needs.terraform-deploy.outputs.alb_dns }}
        run: |
          echo "Testing: http://${ALB_DNS}/"

          for i in {1..30}; do

            if curl \
              --fail \
              --silent \
              --show-error \
              "http://${ALB_DNS}/" > /dev/null; then

              echo "Infrastructure smoke test passed."
              exit 0

            fi

            echo "Attempt ${i}/30 failed. Retrying in 10 seconds..."
            sleep 10

          done

          echo "Infrastructure smoke test failed."
          exit 1